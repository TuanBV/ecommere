name: ecommere

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: core
      MARIADB_ROOT_PASSWORD: root
      MARIADB_ROOT_HOST: "%"
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./scripts/dump-core.sql:/docker-entrypoint-initdb.d/01-core.sql:ro
      - ./database/init/02-admin-dev.sql:/docker-entrypoint-initdb.d/02-admin-dev.sql:ro
      - ./database/migrations/20260702_facebook_posts.sql:/docker-entrypoint-initdb.d/03-facebook-posts.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "healthcheck.sh --connect --innodb_initialized && mariadb -uroot -p$${MARIADB_ROOT_PASSWORD} -e \"CREATE DATABASE IF NOT EXISTS core CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' IDENTIFIED BY '$${MARIADB_ROOT_PASSWORD}' WITH GRANT OPTION; FLUSH PRIVILEGES;\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  db-init:
    image: mariadb:10.11
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ./scripts/dump-core.sql:/seed/01-core.sql:ro
      - ./database/init/02-admin-dev.sql:/seed/02-admin-dev.sql:ro
      - ./database/migrations/20260702_facebook_posts.sql:/seed/03-facebook-posts.sql:ro
    command: >
      sh -c "
        until mariadb-admin ping -h db -uroot -p$${MARIADB_ROOT_PASSWORD} --silent; do sleep 1; done;
        mariadb -h db -uroot -p$${MARIADB_ROOT_PASSWORD} -e \"CREATE DATABASE IF NOT EXISTS core CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\";
        PRODUCT_TABLE=$$(mariadb -N -h db -uroot -p$${MARIADB_ROOT_PASSWORD} core -e \"SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'product';\");
        if [ \"$$PRODUCT_TABLE\" = \"0\" ]; then
          mariadb -h db -uroot -p$${MARIADB_ROOT_PASSWORD} core < /seed/01-core.sql;
          mariadb -h db -uroot -p$${MARIADB_ROOT_PASSWORD} core < /seed/02-admin-dev.sql;
        fi;
        mariadb -h db -uroot -p$${MARIADB_ROOT_PASSWORD} core < /seed/03-facebook-posts.sql;
        mariadb -h db -uroot -p$${MARIADB_ROOT_PASSWORD} core -e \"SELECT COUNT(*) AS products FROM product WHERE COALESCE(del_flag,0)=0;\";
      "
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:root@db:3306/core
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:3001}
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3010}:3001"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001/api
      API_PROXY_ORIGIN: http://api:3001
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_MEDIA_BASE_URL: ""
    ports:
      - "${WEB_PORT:-3009}:3000"
    depends_on:
      - api
volumes:
  db-data:
